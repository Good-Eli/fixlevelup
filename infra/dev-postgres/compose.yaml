name: fixlevelup-dev-postgres

services:
  postgres:
    image: postgres:18.7-bookworm@sha256:1757c628698dd1ca67ff7a5fc386bfd91040afc62a45484c346c788b0cbe5402
    platform: linux/amd64
    container_name: fixlevelup-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixlevelup_dev
      POSTGRES_USER: fixlevelup_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - postgres-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U fixlevelup_dev -d fixlevelup_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
    name: fixlevelup-dev-postgres-data

networks:
  postgres-net:
    name: fixlevelup-dev-postgres-net
    driver: bridge
