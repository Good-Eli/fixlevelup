# One-shot synthetic updater. Use a new empty output directory for each run.
DatabaseDirectory /defs
DatabaseOwner nobody
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
CompressLocalDatabase yes
ScriptedUpdates yes
TestDatabases yes
Bytecode yes
ConnectTimeout 15
ReceiveTimeout 120
MaxAttempts 1
