name: P05 S0 restore diagnostic

on:
  push:
    branches:
      - fix/p05-db-boundary-city-state-2026-11-26

permissions:
  contents: read

jobs:
  legacy-s0:
    name: Focused complete file-restore proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24.22.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
          check-latest: false
          package-manager-cache: false

      - name: Verify pinned toolchain and install workspace
        run: |
          set -euo pipefail
          corepack enable
          test "$(node --version)" = "v24.22.3"
          test "$(corepack pnpm --version)" = "12.21.0"
          corepack pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies

      - name: Prepare exact reviewed scanner and decoder fixture
        run: node infra/file-processing/prepare-ci-fixture.mjs

      - name: Build current-tree P05 S3 image
        run: node infra/p05-lab/lab.mjs s3image --rebuild

      - name: Start isolated PostgreSQL 18.7 lab
        run: node infra/p05-lab/lab.mjs up --image=s3

      - name: Start isolated Garage and file ledger
        run: |
          set -euo pipefail
          node infra/p05-lab/lab.mjs garage up
          node infra/p05-lab/lab.mjs ledger up

      - name: Run the complete file-restore integration test file
        id: restore
        run: |
          set -euo pipefail
          node infra/p05-lab/lab.mjs s3test --old-binary --privacy --ledger --s3 --restore -- --cmd env -u FIXLEVELUP_FILE_PROCESSING_TESTS corepack pnpm exec vitest run --maxWorkers 1 apps/api/tests/file-restore.test.ts

      - name: Stop only this job's isolated services
        if: always()
        run: |
          node infra/p05-lab/lab.mjs ledger down || true
          node infra/p05-lab/lab.mjs garage down || true
          node infra/p05-lab/lab.mjs down || true

      - name: Require the focused restore proof
        if: always()
        run: test "${{ steps.restore.outcome }}" = success
